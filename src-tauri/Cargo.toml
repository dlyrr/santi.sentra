[package]
name = "sentra"
version = "1.4.0"
description = "Sentra - Roblox account manager"
authors = ["experimentid (ex9d)"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sentra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

# For the MCP server's bearer token.
getrandom = "0.2"

# The Roblox installer, shared with santi.weblauncher rather than reimplemented
# here — the two apps fetch the same builds from the same CDN.
roblox-deploy = { git = "https://github.com/dlyrr/santi-weblauncher.git", branch = "main" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "cookies", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
log = "0.4"
once_cell = "1"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
url = "2"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
